name: Publish Containerized Demo

on:
  release:
    types: [created]
  push:
    branches:
      - master
    paths:
      - 'examples/**'
      - '*.go'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/container-release.yml'
  workflow_dispatch:

jobs:
  publish-container:
    name: Build and push the containerized demo
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set version tag
        id: set_version
        run: |
          if [[ "${{ github.event_name }}" == "release" ]]; then
            echo "VERSION=${{ github.event.release.tag_name }}" >> "$GITHUB_ENV"
            echo "IS_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "VERSION=latest" >> "$GITHUB_ENV"
            echo "IS_RELEASE=false" >> "$GITHUB_ENV"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the demo image
        run: |
          docker build -f examples/demo_app/Dockerfile -t guard-agent-go-demo .

      - name: Tag and push to GHCR
        run: |
          docker tag guard-agent-go-demo ghcr.io/guard-core/guard-agent-go:latest
          docker push ghcr.io/guard-core/guard-agent-go:latest

          if [[ "${{ env.IS_RELEASE }}" == "true" ]]; then
            docker tag guard-agent-go-demo ghcr.io/guard-core/guard-agent-go:${{ env.VERSION }}
            docker push ghcr.io/guard-core/guard-agent-go:${{ env.VERSION }}
          fi

